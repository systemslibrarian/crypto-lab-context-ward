parameters:

  - id: PARAM-1
    claim: "HKDF-SHA256 salt is the RAW 32 session bytes, not the 64-character hex string."
    confidence: high
    implementation_provenance: src/seal.ts; verify.py reimplements from docs/MATH.md 2
    code_anchor:
      file: src/seal.ts
      snippet: |
        export async function deriveRoleKey(
    evidence:
      - src/protocol.test.ts "uses the RAW session bytes as HKDF salt, not the hex string"
      - verify.py mutation test: salting with the hex string fails 31 checks

  - id: PARAM-2
    claim: >
      Domain separators are cw/v1/leaf, cw/v1/chain, cw/v1/seal, cw/v1/tool and
      the HKDF info prefix cw/v1/role/. All but the info prefix are enc()-wrapped.
    confidence: high
    implementation_provenance: src/envelope.ts, src/chain.ts, src/seal.ts, src/attest.ts
    code_anchor:
      file: src/attest.ts
      snippet: |
        const TOOL_LABEL = 'cw/v1/tool'
    evidence:
      - docs/MATH.md 4, 5, 6

  - id: PARAM-3
    claim: "H_(-1) is 32 zero bytes; prev at seq 0 is 64 zero characters."
    confidence: high
    implementation_provenance: src/bytes.ts constants, used by both chain and verifier
    code_anchor:
      file: src/bytes.ts
      snippet: |
        export const ZERO32 = new Uint8Array(32)
    evidence:
      - src/protocol.test.ts "starts from 32 zero bytes"

  - id: PARAM-4
    claim: >
      Ed25519 comes from vendored @noble/ed25519 3.1.0, pinned by SHA-256 and
      checked offline before every build. SHA-256, HMAC-SHA-256 and HKDF-SHA-256
      come from WebCrypto. No primitive is hand-rolled.
    confidence: high
    implementation_provenance: vendor/noble-ed25519/INTEGRITY.md, tools/check-vendor.mjs
    code_anchor:
      file: src/primitives.ts
      snippet: |
        import * as ed from '../vendor/noble-ed25519/index.js'
    evidence:
      - vendor/noble-ed25519/SHA256SUMS
      - npm test runs check:vendor first

# ---------------------------------------------------------------------------
open_questions:

  - id: OQ-1
    question: >
      Do provenance labels help a MODEL, as opposed to a human auditor or an
      automated policy layer?
    why_open: >
      Untestable with a deterministic mock. Establishing whether a real model
      conditions on a SOURCE: TOOL_RESULT label would require an evaluation
      against real models, which this exhibit deliberately does not perform.
    bearing_on_claims: [NEG-2]

  - id: OQ-2
    question: >
      Does the ROLE_MISMATCH counterfactual probe have a false-positive mode?
    why_open: >
      The probe reports the first candidate role whose recomputed tag matches.
      A collision would require an HMAC-SHA-256 forgery, so a false positive is
      infeasible under the stated assumptions -- but the probe is a
      construction of this exhibit rather than a standard one, and it has not
      been analysed beyond that argument.
    bearing_on_claims: [SEC-4]

  - id: OQ-3
    question: >
      Do the two implementations agree on Ed25519 edge cases outside the
      fixtures?
    why_open: >
      @noble/ed25519 verifies under ZIP-215 semantics by default; the Python
      `cryptography` package follows RFC 8032. The two differ on small-order
      and non-canonical points. Every signature in the fixtures is honestly
      generated, so both accept them and the difference never arises here --
      but the exhibit does not include adversarial signature vectors that would
      expose it, and a production system would need to pin one semantics.
    bearing_on_claims: [SEC-2]
    see: verification/HARNESS.md

  - id: OQ-4
    question: >
      Is the scripted agent's trust policy representative of deployed systems?
    why_open: >
      The policy -- treat every authoritative-role segment as instruction -- is
      described in the brief as one real systems commonly use, and matches the
      shape of the attacks in arXiv:2506.02040 and arXiv:2506.09956. This
      exhibit does not survey deployed systems to establish how common it is,
      and makes no measurement of any real model.
    bearing_on_claims: [NEG-1, NEG-2]

